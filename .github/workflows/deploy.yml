name: Deploy to GitHub Pages

on:
  push:
    branches: [master,tilted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 20

      - name: Build Vite project
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run build

      - name: Package static site (no build step)
        if: hashFiles('package.json') == ''
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' --exclude='.github' --exclude='.claude' \
            --exclude='.codex' --exclude='.cursor' --exclude='.gemini' \
            --exclude='.opencode' --exclude='openspec' --exclude='node_modules' \
            --exclude='_site' \
            ./ _site/

      - name: Select publish directory
        id: publish-dir
        run: |
          if [ -f package.json ]; then
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          else
            echo "dir=_site" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.publish-dir.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
